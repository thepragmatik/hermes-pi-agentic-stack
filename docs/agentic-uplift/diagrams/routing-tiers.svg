<svg viewBox="0 0 1280 480" role="img" aria-labelledby="tiers-title tiers-desc" xmlns="http://www.w3.org/2000/svg"><title id="tiers-title">Five-tier routing architecture</title><desc id="tiers-desc">A mission with durable state passes through Tier 0 deterministic eligibility and policy, Tier 1 mission-profile inference, Tier 2 bounded workflow and agent selection, Tier 3 model-role optimization, and Tier 4 gateway physical execution with OpenRouter first, before outcome telemetry feeds the offline research and training plane. Merge and approval authority sits outside all five tiers.</desc><defs><marker id="ta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><style>.b{fill:#fffaf3;stroke:#5b4636;stroke-width:1.6}.t{font:12.5px system-ui;fill:#2d2419}.h{font:bold 13.5px system-ui;fill:#2d2419}.e{stroke:#5b4636;stroke-width:2;marker-end:url(#ta)}.gate{stroke:#be123c;stroke-width:2.4}.amb{stroke:#a16207;stroke-width:2.4}.ev{stroke:#4d7c0f;stroke-width:2.4}.s{font:11px system-ui;fill:#5b4636}.dash{fill:none;stroke:#be123c;stroke-width:1.2;stroke-dasharray:5 4}@media(prefers-color-scheme:dark){.b{fill:#29241e;stroke:#e8dccf}.t,.h,.s{fill:#e8dccf}.e{stroke:#e8dccf}.gate{stroke:#f2789f}.amb{stroke:#d4a843}.ev{stroke:#a4c273}.dash{stroke:#f2789f}}</style>
<rect class="b" x="340" y="12" width="300" height="40" rx="8"/><text class="h" x="490" y="37" text-anchor="middle">MISSION + durable state</text>
<line class="e" x1="490" y1="52" x2="490" y2="76"/>
<rect class="b gate" x="240" y="80" width="500" height="56" rx="8"/><text class="h" x="490" y="101" text-anchor="middle">Tier 0 — deterministic eligibility / policy</text><text class="s" x="490" y="120" text-anchor="middle">privacy · secrets/PII · LOCAL_ONLY/ZDR · sandbox/network · risk/approval</text>
<line class="e" x1="490" y1="136" x2="490" y2="160"/>
<rect class="b" x="240" y="164" width="500" height="56" rx="8"/><text class="h" x="490" y="185" text-anchor="middle">Tier 1 — mission-profile inference</text><text class="s" x="490" y="204" text-anchor="middle">task families · domain/phase · complexity/uncertainty · intensity</text>
<line class="e" x1="490" y1="220" x2="490" y2="244"/>
<rect class="b" x="240" y="248" width="500" height="56" rx="8"/><text class="h" x="490" y="269" text-anchor="middle">Tier 2 — bounded workflow / agent selection</text><text class="s" x="490" y="288" text-anchor="middle">Hermes-only · research executor · Pi worker · review worker · local tools · abstain/escalate</text>
<line class="e" x1="490" y1="304" x2="490" y2="328"/>
<rect class="b" x="240" y="332" width="500" height="56" rx="8"/><text class="h" x="490" y="353" text-anchor="middle">Tier 3 — model-role optimization</text><text class="s" x="490" y="372" text-anchor="middle">capability/quality floor → quality/cost/latency/reliability/cache scoring</text>
<line class="e" x1="490" y1="388" x2="490" y2="412"/>
<rect class="b amb" x="200" y="416" width="580" height="40" rx="8"/><text class="h" x="490" y="433" text-anchor="middle">Tier 4 — gateway / physical execution</text><text class="s" x="490" y="450" text-anchor="middle">OpenRouter-first · qualified direct/local adapter</text>
<line class="e ev" x1="780" y1="436" x2="840" y2="436"/><line class="e ev" x1="840" y1="436" x2="840" y2="380"/><line class="e ev" x1="840" y1="380" x2="892" y2="380"/>
<rect class="b" x="900" y="356" width="280" height="48" rx="8"/><text class="h" x="1040" y="377" text-anchor="middle">Outcome telemetry</text><text class="s" x="1040" y="394" text-anchor="middle">→ offline research / training plane</text>
<rect class="dash" x="880" y="80" width="330" height="70" rx="8"/><text class="s" x="1045" y="108" text-anchor="middle" style="fill:#be123c">Merge/approval authority sits</text><text class="s" x="1045" y="126" text-anchor="middle" style="fill:#be123c">OUTSIDE all five tiers</text>
</svg>
