name: Apply refinement bundle

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/apply-refinement.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated refinement
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/refinement.b64
          base64 -d /tmp/refinement.b64 > /tmp/refinement.tgz
          tar -xzf /tmp/refinement.tgz -C .
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: refine stack research, skill slicing, adversarial review and Pages site'
          git push origin HEAD:main
